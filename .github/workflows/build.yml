name: Build Glass Browser

on:
  push:
    branches: [ main, trae/solo-agent-VinAGq ]
  pull_request:
    branches: [ main, trae/solo-agent-VinAGq ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '10'

    - name: Install dependencies
      run: |
        npm install --verbose
        npm install electron@~1.7.11 --save-dev --verbose

    - name: Build for Windows
      run: |
        npm install electron-packager@12.2.0 -g --verbose
        electron-packager . "Glass Browser" --platform=win32 --arch=x64 --out=build --verbose

    - name: Upload artifact
      uses: actions/upload-artifact@v2
      with:
        name: glass-browser
        path: build/
