name: Build Glass Browser

on:
  push:
    branches: [ main, trae/solo-agent-VinAGq ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm install

      - name: Install electron-packager
        run: npm install -g electron-packager@14.2.1

      - name: Build application
        run: electron-packager . GlassBrowser --platform=win32 --arch=x64 --out=build --overwrite

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: glass-browser
          path: build/
