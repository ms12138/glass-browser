name: Build Glass Browser

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'

    - name: Install dependencies
      run: npm install

    - name: Build for Windows
      run: |
        npm install electron-packager -g
        electron-packager . "Glass Browser" --platform=win32 --arch=x64 --out=build

    - name: Upload artifact
      uses: actions/upload-artifact@v2
      with:
        name: glass-browser
        path: build/
