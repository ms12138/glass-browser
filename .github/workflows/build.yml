name: Build Glass Browser

on:
  push:
    branches: [ main, trae/solo-agent-VinAGq ]
  pull_request:
    branches: [ main, trae/solo-agent-VinAGq ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          
      - name: Install dependencies
        run: npm install
        
      - name: Build
        run: npm run build:win
        
      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: glass-browser
          path: dist
