name: Build Glass Browser

on:
  push:
    branches: [ main, trae/solo-agent-VinAGq ]
  pull_request:
    branches: [ main, trae/solo-agent-VinAGq ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'

    - name: Install dependencies
      run: |
        npm install -g npm@8
        npm install

    - name: Install Wine for Windows build
      run: |
        sudo apt-get update
        sudo apt-get install -y wine64

    - name: Build for Windows
      run: |
        npm install electron-packager@14.2.1 -g
        electron-packager . "Glass Browser" --platform=win32 --arch=x64 --out=build --electron-version=8.5.5

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: glass-browser
        path: build/
